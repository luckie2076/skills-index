name: daily-sync

# Generate the skills index and publish `data/` as a GitHub Release.
# Data is never committed to the main branch (see .gitignore); each run is a
# self-contained snapshot uploaded as Release assets.
#
# Triggers:
#   - Daily at 00:00 UTC (full refresh on `main`).
#   - Push to `main`  -> full refresh (all pages).
#   - Push to `test`  -> smoke test (single page, 1-page fetch).
#   - Manual run via workflow_dispatch.
#
# Old releases are pruned to keep at most KEEP_RELEASES entries (main only).

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - test
  workflow_dispatch: {}

# Only one run at a time: concurrent runs would race on the published Release
# (cache restore, publish, prune) and corrupt the incremental chain.
concurrency:
  group: daily-sync
  cancel-in-progress: true

permissions:
  contents: write

env:
  KEEP_RELEASES: "30"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Decide fetch scope by branch
        id: scope
        run: |
          set -euo pipefail
          branch="${{ github.ref_name }}"
          echo "branch=$branch"
          if [ "$branch" = "test" ]; then
            # Smoke test: fetch only 1 page.
            echo "pages_arg=--pages 1" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=alpha-" >> "$GITHUB_OUTPUT"
          else
            # Full refresh on main (and any other branch): fetch all pages.
            echo "pages_arg=" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=data-" >> "$GITHUB_OUTPUT"
            # Repos with more than 500 skills are excluded (default cap).
          fi
          # Human-readable, lexicographically sortable UTC timestamp used for
          # the release tag/name (e.g. 20260820T143015Z).
          echo "ts=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      # Full refreshes (main) restore the previous run's data/by-source/ from
      # the newest `data-` release so the incremental scan can reuse pushed_at
      # and blob sha fingerprints. Smoke tests (test branch, --pages 1) skip
      # this and go through the clean full-build path, leaving main's chain
      # untouched.
      - name: Restore incremental cache from latest data- release
        if: steps.scope.outputs.pages_arg == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `latest` may point at a `test-` release, so resolve the newest
          # `data-` prefixed release by creation time instead.
          latest=$(gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^data-' | head -n 1 || true)
          if [ -z "$latest" ]; then
            echo "No previous data- release; running a full scan this time."
            exit 0
          fi
          echo "Restoring scan cache from release: $latest"
          gh release download "$latest" --pattern data.tar.gz
          # Restore only by-source/ (the incremental fingerprints); root
          # summaries are regenerated by fetch/scan/index below.
          tar -xzf data.tar.gz -C "$RUNNER_TEMP" data/by-source
          mkdir -p data
          cp -r "$RUNNER_TEMP"/data/by-source data/

      # GH_PAT (personal access token, 5000 req/h) is preferred over the
      # Actions GITHUB_TOKEN (1000 req/h per repo) to keep the meta phase fast;
      # tarball downloads (SKILL.md content) are not billed to the quota at all.
      - name: Fetch + scan + index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: uv run skills-index update ${{ steps.scope.outputs.pages_arg }}

      - name: Package data snapshot
        run: tar -czf data.tar.gz data/

      - name: Build Release body from run summary
        id: report
        run: |
          set -euo pipefail
          {
            echo "body<<REPORT_EOF"
            cat data/run-summary.md
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          # `<prefix>-<UTC timestamp>` so releases are human-readable and sort
          # chronologically by tag (e.g. data-20260820T143015Z).
          tag_name: ${{ steps.scope.outputs.tag_prefix }}${{ steps.scope.outputs.ts }}
          name: "${{ steps.scope.outputs.tag_prefix }}${{ steps.scope.outputs.ts }}"
          body: |
            Automated skills index snapshot.
            Branch: `${{ github.ref_name }}`
            Scope: ${{ github.ref_name == 'test' && 'smoke test (1 page)' || 'full refresh (all pages)' }}
            Generated at ${{ steps.scope.outputs.ts }} (UTC).

            ${{ steps.report.outputs.body }}
          files: |
            data.tar.gz
            data/index.jsonl
            data/fetched-skills.jsonl
            data/scanned-repos.jsonl
            data/scanned-repos-by-stars.jsonl
            data/scanned-repos-by-skillcount.jsonl
            data/run-summary.md

      # Prune only on main, so test smoke runs don't consume the retention quota.
      - name: Prune old releases
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ env.KEEP_RELEASES }}
          PREFIX: ${{ steps.scope.outputs.tag_prefix }}
        run: |
          set -euo pipefail
          # Prune only this prefix's releases (keep test- smoke runs untouched).
          mapfile -t RELEASES < <(gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | .[].tagName' | grep "^${PREFIX}")
          total=${#RELEASES[@]}
          if [ "$total" -le "$KEEP" ]; then
            echo "Nothing to prune ($total <= $KEEP)."
            exit 0
          fi
          to_delete=$(( total - KEEP ))
          echo "Pruning $to_delete oldest ${PREFIX} release(s) (keeping $KEEP)."
          for (( i=0; i<to_delete; i++ )); do
            tag="${RELEASES[$i]}"
            echo "Deleting $tag"
            gh release delete "$tag" --yes || true
            git push --delete origin "$tag" || true
          done
